<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 155" width="100%" height="100%">
  <defs>
    <!-- Extended Atmospheric Glow covering Name down past Asia Pacific line -->
    <radialGradient id="floating-glow-dark" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6E0D39" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#4C0827" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#200116" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Reliable UserSpaceOnUse Gradient for Horizontal Dashed Line -->
    <linearGradient id="dash-gradient-dark" x1="280" y1="0" x2="570" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C0827" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8B144B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E6EBE0" stop-opacity="1"/>
      <stop offset="80%" stop-color="#8B144B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4C0827" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Floating Glow (Expanded to fully embrace Name and Subtitles) -->
  <ellipse cx="425" cy="78" rx="400" ry="74" fill="url(#floating-glow-dark)"/>

  <!-- Main Name Typography -->
  <text x="425" y="52" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">Rhona-Mae Prudenciado</text>

  <!-- Centered Dashed Accent Divider Line -->
  <line x1="290" y1="72" x2="560" y2="72" stroke="url(#dash-gradient-dark)" stroke-width="2" stroke-dasharray="8,5" stroke-linecap="round"/>

  <!-- Aspiring Cloud Architect -->
  <text x="425" y="96" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#E6EBE0" fill-opacity="0.95">ASPIRING CLOUD ARCHITECT</text>

  <!-- Asia Pacific College Manila -->
  <text x="425" y="115" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#E6EBE0" fill-opacity="0.65">ASIA PACIFIC COLLEGE · MANILA, PH</text>
</svg>
