<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="100%">
  <defs>
    <radialGradient id="floating-glow-dark" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6E0D39" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#4C0827" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="divider-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C0827" stop-opacity="0"/>
      <stop offset="20%" stop-color="#6E0D39" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E6EBE0" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#6E0D39" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4C0827" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Floating Glow (Seamless on GitHub Dark #0d1117) -->
  <ellipse cx="425" cy="85" rx="380" ry="75" fill="url(#floating-glow-dark)"/>

  <!-- Main Name Typography -->
  <text x="425" y="65" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">Rhona-Mae Prudenciado</text>

  <!-- Centered Accent Divider Line -->
  <line x1="280" y1="85" x2="570" y2="85" stroke="url(#divider-dark)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Aspiring Cloud Architect (Matching Asia Pacific College styling) -->
  <text x="425" y="112" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#E6EBE0" fill-opacity="0.92">ASPIRING CLOUD ARCHITECT</text>

  <!-- Asia Pacific College Manila -->
  <text x="425" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#E6EBE0" fill-opacity="0.6">ASIA PACIFIC COLLEGE · MANILA, PH</text>
</svg>
