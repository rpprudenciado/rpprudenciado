<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 130" width="100%" height="100%">
  <defs>
    <!-- Extended Full-Height Radial Glow covering Name down past Asia Pacific Line -->
    <radialGradient id="floating-glow-dark" cx="50%" cy="51%" r="78%">
      <stop offset="0%" stop-color="#7A1240" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#5A0B2E" stop-opacity="0.42"/>
      <stop offset="65%" stop-color="#38061D" stop-opacity="0.22"/>
      <stop offset="85%" stop-color="#200116" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Canvas Rect Base: Zero visible outline, full vertical reach -->
  <rect width="850" height="130" fill="url(#floating-glow-dark)"/>

  <!-- Main Name Typography -->
  <text x="425" y="48" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">Rhona-Mae Prudenciado</text>

  <!-- Aspiring Cloud Architect (Encompassed by Glow) -->
  <text x="425" y="76" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#E6EBE0" fill-opacity="0.95">ASPIRING CLOUD ARCHITECT</text>

  <!-- Asia Pacific College Manila (Encompassed by Glow) -->
  <text x="425" y="98" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#E6EBE0" fill-opacity="0.7">ASIA PACIFIC COLLEGE · MANILA, PH</text>
</svg>
