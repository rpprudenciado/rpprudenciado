<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6EBE0"/>
      <stop offset="50%" stop-color="#EFF3EC"/>
      <stop offset="100%" stop-color="#F8FAF7"/>
    </linearGradient>

    <linearGradient id="line-accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C0827" stop-opacity="0"/>
      <stop offset="25%" stop-color="#4C0827" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#200116" stop-opacity="1"/>
      <stop offset="75%" stop-color="#4C0827" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4C0827" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#4C0827" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>

    <radialGradient id="glow-light" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4C0827" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E6EBE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="180" rx="14" fill="url(#bg-light)"/>

  <!-- Subtle Architectural Grid -->
  <rect width="850" height="180" rx="14" fill="url(#grid-light)"/>

  <!-- Ambient Glow -->
  <ellipse cx="425" cy="90" rx="340" ry="80" fill="url(#glow-light)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="848" height="178" rx="13" fill="none" stroke="#4C0827" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Pill Badge: Specialization -->
  <g transform="translate(265, 24)">
    <rect width="320" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#4C0827" stroke-width="1" stroke-opacity="0.35"/>
    <text x="160" y="16" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#4C0827">CLOUD SOLUTIONS &amp; SYSTEMS ARCHITECTURE</text>
  </g>

  <!-- Main Name Typography -->
  <text x="425" y="104" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" letter-spacing="0.5" fill="#100007">Rhona-Mae Prudenciado</text>

  <!-- Centered Accent Glow Line -->
  <line x1="290" y1="122" x2="560" y2="122" stroke="url(#line-accent-light)" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtitle Coordinates -->
  <text x="425" y="148" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" fill="#2D0605" fill-opacity="0.75">ASIA PACIFIC COLLEGE · MANILA, PH</text>
</svg>
