<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <!-- Deep Burgundy Red Radial Glow for Light Mode: Seamless 0-opacity decay -->
    <radialGradient id="floating-glow-light" cx="425" cy="96" r="75" gradientUnits="userSpaceOnUse" gradientTransform="matrix(3.4 0 0 1 -1020 0)">
      <stop offset="0%" stop-color="#800020" stop-opacity="0.32"/>
      <stop offset="30%" stop-color="#6B0A24" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#4A0012" stop-opacity="0.10"/>
      <stop offset="80%" stop-color="#4A0012" stop-opacity="0.03"/>
      <stop offset="95%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Canvas: Gradient drops to 0 opacity well within the 200px bounds (Zero Square Cutoff) -->
  <rect width="850" height="200" fill="url(#floating-glow-light)"/>

  <!-- Main Name Typography -->
  <text x="425" y="86" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" letter-spacing="0.5" fill="#100007">Rhona-Mae Prudenciado</text>

  <!-- Aspiring Cloud Architect (In-Line Centered) -->
  <text x="425" y="114" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#4C0827">ASPIRING CLOUD ARCHITECT</text>

  <!-- Asia Pacific College Manila (In-Line Centered) -->
  <text x="425" y="134" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#2D0605" fill-opacity="0.8">ASIA PACIFIC COLLEGE · MANILA, PH</text>
</svg>
