<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%" height="100%">
  <defs>
    <!-- Enhanced Atmospheric Radial Glow for Light Mode -->
    <radialGradient id="floating-glow-light" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4C0827" stop-opacity="0.14"/>
      <stop offset="25%" stop-color="#E6EBE0" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#F4F6F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Harmonized Dashed Line Gradient -->
    <linearGradient id="dash-gradient-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C0827" stop-opacity="0"/>
      <stop offset="20%" stop-color="#4C0827" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#200116" stop-opacity="1"/>
      <stop offset="80%" stop-color="#4C0827" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4C0827" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Floating Glow -->
  <ellipse cx="425" cy="65" rx="360" ry="60" fill="url(#floating-glow-light)"/>

  <!-- Main Name Typography -->
  <text x="425" y="52" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" letter-spacing="0.5" fill="#100007">Rhona-Mae Prudenciado</text>

  <!-- Centered Dashed Accent Divider Line -->
  <line x1="320" y1="72" x2="530" y2="72" stroke="url(#dash-gradient-light)" stroke-width="2" stroke-dasharray="7,4" stroke-linecap="round"/>

  <!-- Aspiring Cloud Architect -->
  <text x="425" y="94" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#4C0827">ASPIRING CLOUD ARCHITECT</text>

  <!-- Asia Pacific College Manila (Tighter 18px gap) -->
  <text x="425" y="112" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#2D0605" fill-opacity="0.75">ASIA PACIFIC COLLEGE · MANILA, PH</text>
</svg>
