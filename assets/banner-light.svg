<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 135" width="100%" height="100%">
  <defs>
    <!-- Darker, Reddish Wine Glow matching hand-drawn outline -->
    <radialGradient id="floating-glow-light" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#6B0E37" stop-opacity="0.24"/>
      <stop offset="40%" stop-color="#7A1240" stop-opacity="0.16"/>
      <stop offset="75%" stop-color="#6B0E37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow Enclosing Name down past Asia Pacific Line -->
  <ellipse cx="425" cy="67" rx="360" ry="60" fill="url(#floating-glow-light)"/>

  <!-- Main Name Typography -->
  <text x="425" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" letter-spacing="0.5" fill="#100007">Rhona-Mae Prudenciado</text>

  <!-- Aspiring Cloud Architect (Tighter Spacing, No Divider Line) -->
  <text x="425" y="78" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#4C0827">ASPIRING CLOUD ARCHITECT</text>

  <!-- Asia Pacific College Manila -->
  <text x="425" y="98" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#2D0605" fill-opacity="0.75">ASIA PACIFIC COLLEGE · MANILA, PH</text>
</svg>
